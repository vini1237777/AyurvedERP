# Runs the whole app locally: docker compose up --build
# Client: http://localhost:8080   API: http://localhost:5080/health
x-database-url: &database-url postgresql://aushadhi:${POSTGRES_PASSWORD:-aushadhi_local}@postgres:5432/aushadhi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aushadhi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aushadhi_local}
      POSTGRES_DB: aushadhi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aushadhi -d aushadhi"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once, so several API workers never race to apply the same migration.
  migrate:
    build:
      context: ./server
      target: build
    environment:
      DATABASE_URL: *database-url
    command: sh -c "npx prisma migrate deploy && npm run bootstrap"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./server
      target: runner
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      PORT: "5000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in a .env file}
    ports:
      - "5080:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:

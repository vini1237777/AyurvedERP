server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # File names in assets change with each build, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app calls /api on its own origin; forward it to the API container.
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Send unknown paths to the app, so refreshing /sales still works.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

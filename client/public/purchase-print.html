<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Purchase Document</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        color: #000;
        background: #fff;
        font-size: 11px;
      }
      @media screen {
        body {
          background: #cbd5e1;
          padding: 14px;
        }
        .screen-bar {
          background: #1e293b;
          color: #fff;
          padding: 10px 16px;
          display: flex;
          gap: 10px;
          align-items: center;
          justify-content: space-between;
          border-radius: 8px;
          margin-bottom: 12px;
          max-width: 794px;
          margin-left: auto;
          margin-right: auto;
        }
        .page-wrapper {
          background: #fff;
          padding: 18px;
          max-width: 794px;
          margin: 0 auto;
          border-radius: 4px;
          box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .btn {
          border: none;
          padding: 7px 14px;
          border-radius: 6px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
        }
        .btn-print {
          background: #2563eb;
          color: #fff;
        }
        .btn-close {
          background: #475569;
          color: #fff;
        }
      }
      @media print {
        .screen-bar {
          display: none;
        }
        .page-wrapper {
          padding: 0;
        }
      }
      .doc-title {
        text-align: center;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 3px;
        padding: 5px;
        border: 1px solid #000;
        margin-bottom: 6px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid #000;
        margin-bottom: 6px;
      }
      .meta-grid > div {
        padding: 6px 8px;
      }
      .meta-grid > div + div {
        border-left: 1px solid #000;
      }
      .meta-label {
        font-size: 9px;
        color: #555;
        font-weight: bold;
      }
      .meta-value {
        font-size: 11px;
        font-weight: bold;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      table th {
        background: #f1f5f9;
        border: 1px solid #000;
        padding: 4px 6px;
        font-size: 10px;
        text-align: center;
      }
      table td {
        border: 1px solid #000;
        padding: 4px 6px;
        font-size: 10px;
      }
      .right {
        text-align: right;
      }
      .center {
        text-align: center;
      }
      .totals-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 6px;
      }
      .totals-table {
        width: 320px;
        font-size: 11px;
      }
      .totals-table td {
        border: 1px solid #000;
        padding: 4px 8px;
      }
      .grand-row {
        background: #f1f5f9;
        font-weight: bold;
        font-size: 13px;
      }
      .notes-box {
        border: 1px solid #000;
        padding: 8px;
        margin-top: 6px;
        font-size: 11px;
        min-height: 40px;
      }
      .notes-label {
        font-size: 9px;
        font-weight: bold;
        color: #555;
        margin-bottom: 3px;
      }
      .signatory {
        margin-top: 24px;
        text-align: right;
        padding-right: 12px;
        font-size: 11px;
      }
      .signatory .line {
        margin-top: 32px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="screen-bar">
      <strong id="screen-title">Purchase Document</strong>
      <div style="display: flex; gap: 8px">
        <button class="btn btn-print" onclick="window.print()">
          🖨 Print
        </button>
        <button class="btn btn-close" onclick="window.close()">Close</button>
      </div>
    </div>

    <div class="page-wrapper" id="page"></div>

    <script src="/purchase-print.js"></script>
  </body>
</html>

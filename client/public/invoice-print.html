<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Invoice — Aushadhi Wellness</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 6mm;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        color: #000;
        background: #fff;
      }
      @media screen {
        body {
          background: #cbd5e1;
          padding: 12px;
        }
        .screen-bar {
          background: #1e293b;
          color: #fff;
          padding: 10px 16px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-radius: 8px;
          margin-bottom: 10px;
          font-family: Arial, sans-serif;
        }
        .copy-bar {
          background: #fff;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          padding: 8px 14px;
          margin-bottom: 10px;
          display: flex;
          gap: 20px;
          flex-wrap: wrap;
          align-items: center;
          font-family: Arial, sans-serif;
        }
        .copy-label {
          font-size: 13px;
          color: #475569;
          display: flex;
          align-items: center;
          gap: 6px;
          cursor: pointer;
        }
        .copy-cb {
          width: 16px;
          height: 16px;
          accent-color: #2563eb;
        }
        .btn {
          border: none;
          padding: 7px 16px;
          border-radius: 7px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          font-family: Arial, sans-serif;
        }
        .btn-print {
          background: #2563eb;
          color: #fff;
        }
        .btn-dl {
          background: #059669;
          color: #fff;
        }
        .btn-back {
          background: rgba(255, 255, 255, 0.15);
          color: #fff;
          border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn:disabled {
          opacity: 0.6;
          cursor: not-allowed;
        }
        .page-wrapper {
          background: #fff;
          max-width: 210mm;
          margin: 0 auto;
          box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .cut-line {
          text-align: center;
          padding: 4px 0;
          font-size: 10px;
          color: #94a3b8;
          border-top: 1px dashed #94a3b8;
          background: #f8fafc;
        }
      }
      @media print {
        .screen-bar,
        .copy-bar {
          display: none !important;
        }
        .page-wrapper {
          box-shadow: none;
        }
        .half-page {
          height: 141mm;
          overflow: hidden;
          page-break-after: always;
        }
        .cut-line {
          border-top: 1px dashed #666;
          margin: 1mm 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen-bar">
      <div style="display: flex; align-items: center; gap: 10px">
        <button class="btn btn-back" data-action="close">← Back</button>
        <span style="font-weight: 700; font-size: 14px">Invoice Preview</span>
        <span style="font-size: 12px; color: #94a3b8" id="inv-label"></span>
      </div>
      <div style="display: flex; gap: 8px">
        <button class="btn btn-print" data-action="print">🖨 Print</button>
        <button class="btn btn-dl" id="btn-dl" data-action="pdf">
          ⬇ Download PDF
        </button>
      </div>
    </div>
    <div class="copy-bar">
      <span style="font-size: 12px; font-weight: 600; color: #374151"
        >Select Copies:</span
      >
      <label class="copy-label"
        ><input
          class="copy-cb"
          type="checkbox"
          id="cb-customer"
          checked
        />
        Original For Buyer</label
      >
      <label class="copy-label"
        ><input
          class="copy-cb"
          type="checkbox"
          id="cb-transport"
        />
        Duplicate For Transporter</label
      >
      <label class="copy-label"
        ><input
          class="copy-cb"
          type="checkbox"
          id="cb-supplier"
        />
        Triplicate For Supplier</label
      >
      <label class="copy-label"
        ><input
          class="copy-cb"
          type="checkbox"
          id="cb-challan"
        />
        Delivery Challan</label
      >
    </div>
    <div class="page-wrapper"><div id="print-area"></div></div>

    <script src="/invoice-print.js"></script>
  </body>
</html>
